# to run this example, please uncomment the code in `CudaElasobjMixedMG19::Reset()` in "cudaelasobjmixedmg19.cpp" 

GPU_sim: true
gravity: [0, 0, 0]
damping: 0
n_substep: 1
substep_size: 5e-3
kinematic_penalty: 1e6
self_penalty: 1e5
objects:
  - name: random-r
    mesh_type: tet_ele_node
    mesh: ../assets/cube/cube-4817
    translation: [0, -2., 0]
    scale: 4.
    color_diffuse: [0.37, 0.47, 0.53]
    fixed_vertices: [0, 3, 12, 15]
    self_collision: false
    density: 1e3
    elastic_model: NeoHookean
    solver: MixedMG19
    relaxation: .2
    quasi_static: true
    young: 1e7
    poisson: 0.4999
    control_mag: 1e8
    p_smooth: 20.
    p_scale: 1e7
    n_layer: 1
    n_handles: [100]
    A_as_LDU: [0, 0]
    A_as_dense: [1, 0]
    n_iter: 1
    operations:
      - type: GS
        max_iter: 10
      - type: DS
      - type: Direct
      - type: US
      - type: GS
        max_iter: 10



    

