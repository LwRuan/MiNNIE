GPU_sim: true
gravity: [0, -9.8, 0]
damping: 0
n_substep: 1
substep_size: 2.2e-2
kinematic_penalty: 5e4
self_penalty: 2e6
objects:
  - name: armadillo
    mesh_type: tet_ele_node
    mesh: ../assets/armadillo/armadillo-77k
    rotation_angle: 180
    rotation_axis: [0, 1, 0]
    translation: [0, 10, 0]
    color_diffuse: [0.37, 0.47, 0.53]
    quasi_static: false
    self_collision: true
    density: 1e3
    elastic_model: NeoHookean
    solver: MixedMG19
    young: 5e6
    poisson: 0.49
    control_mag: 1e7
    relaxation: .4
    n_layer: 2
    n_handles: [400, 800]
    A_as_LDU: [0, 0, 0]
    A_as_dense: [1, 0, 0]
    p_scale: 1e6
    p_smooth: 1.
    n_iter: 1
    operations:
      - type: GS
        max_iter: 6
      - type: DS
      - type: GS
        max_iter: 6
      - type: DS
      - type: Direct
      - type: US
      - type: GS
        max_iter: 6
      - type: US
      - type: GS
        max_iter: 6
  - name: floor
    obj_type: kinematic
    mesh_type: implicit
    implicit_geo_type: Plane
    implicit_geo_params: [0, 0, 0, 0, 1, 0, 50, 50, 10, 10]
    color_diffuse: [0.2, 0.2, 0.2]
  - name: cylinder1
    obj_type: kinematic
    mesh_type: implicit
    implicit_geo_type: Cylinder
    implicit_geo_params: [0, 4, 4, 1, 0, 0, 3, 20, 20, 20]
    color_diffuse: [0.8, 0.8, 0.8]
    velocity: [0, 0, -1.2]
    start_frame: 100
    end_frame: 200
  - name: cylinder2
    obj_type: kinematic
    mesh_type: implicit
    implicit_geo_type: Cylinder
    implicit_geo_params: [0, 4, -8, 1, 0, 0, 3, 20, 20, 20]
    color_diffuse: [0.8, 0.8, 0.8]
    velocity: [0, 0, 1.2]
    start_frame: 100
    end_frame: 200
  - name: cylinder3
    obj_type: kinematic
    mesh_type: implicit
    implicit_geo_type: Cylinder
    implicit_geo_params: [0, 30, 2, 1, 0, 0, 4, 20, 20, 20]
    color_diffuse: [0.8, 0.8, 0.8]
    velocity: [0, -3.4, 0]
    start_frame: 0
    end_frame: 250
  - name: cylinder4
    obj_type: kinematic
    mesh_type: implicit
    implicit_geo_type: Cylinder
    implicit_geo_params: [0, 30, -6, 1, 0, 0, 4, 20, 20, 20]
    color_diffuse: [0.8, 0.8, 0.8]
    velocity: [0, -3.4, 0]
    start_frame: 0
    end_frame: 250
